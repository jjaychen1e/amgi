name: Filtered Deck Tests

# Verification-only workflow for feat/create-filtered-deck: builds the engine
# and runs the simulator test suites. Lives on its own branch so the feature
# branch carries no CI changes.
on:
  push:
    branches:
      - 'ci/filtered-deck-tests'
  workflow_dispatch:

concurrency:
  group: filtered-deck-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Rust nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-
            ${{ runner.os }}-rust-

      - name: Install Homebrew dependencies
        run: brew install protobuf swift-protobuf xcodegen

      - name: Build Rust XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Generate Swift protobuf types
        run: ./scripts/generate-protos.sh

      - name: Generate Xcode project
        run: cd AmgiApp && xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in devices.items():
              if "iOS" in runtime:
                  for d in items:
                      if d["name"] == "iPhone 17 Pro":
                          print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Filtered deck tests (bridge + service)
        run: |
          set -o pipefail
          xcodebuild test \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/results/focused.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:AnkiProtoBridgeTests/FilteredDeckLiveTests \
            -only-testing:AnkiProtoBridgeTests/RequestProbeCoverageTests \
            -only-testing:AnkiServicesTests \
            2>&1 | tee "$RUNNER_TEMP/focused.log" | grep -E "Test |✔|✘|error:|passed|failed|\*\* TEST" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Form model tests (DecksFeatureTests)
        run: |
          set -o pipefail
          cd AmgiFeatures
          xcodebuild -list | head -40
          xcodebuild test \
            -scheme AmgiFeatures-Package \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataFeatures" \
            -resultBundlePath "$RUNNER_TEMP/results/features.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:DecksFeatureTests/FilteredDeckFormModelTests \
            2>&1 | tee "$RUNNER_TEMP/features.log" | grep -E "Test |✔|✘|error:|passed|failed|\*\* TEST" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Full iOS test plan
        if: always()
        run: |
          set -o pipefail
          xcodebuild test \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/results/full.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee "$RUNNER_TEMP/full.log" | grep -E "✘|error:|passed after|failed after|\*\* TEST|Executed" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-deck-test-results
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/results
          retention-days: 7
