name: Filtered Deck Tests

# Verification-only workflow for feat/create-filtered-deck: builds the engine
# and runs the simulator test suites. Lives on its own branch so the feature
# branch carries no CI changes.
on:
  push:
    branches:
      - 'ci/filtered-deck-tests'
  workflow_dispatch:

concurrency:
  group: filtered-deck-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Rust nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-
            ${{ runner.os }}-rust-

      - name: Install Homebrew dependencies
        run: brew install protobuf swift-protobuf xcodegen

      - name: Build Rust XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Save Rust build artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate Swift protobuf types
        run: ./scripts/generate-protos.sh

      - name: Generate Xcode project
        run: cd AmgiApp && xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in devices.items():
              if "iOS" in runtime:
                  for d in items:
                      if d["name"] == "iPhone 17 Pro":
                          print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Filtered deck tests (bridge + service)
        run: |
          set +e
          xcodebuild test \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/results/focused.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:AnkiProtoBridgeTests/FilteredDeckLiveTests \
            -only-testing:AnkiProtoBridgeTests/RequestProbeCoverageTests \
            -only-testing:AnkiServicesTests \
            > "$RUNNER_TEMP/focused.log" 2>&1
          status=$?
          grep -E "Test |✔|✘|error:|passed|failed|\*\* TEST" "$RUNNER_TEMP/focused.log" | tail -400
          exit $status

      - name: Form model tests (DecksFeatureTests)
        run: |
          set +e
          cd AmgiFeatures
          xcodebuild -list | head -40
          xcodebuild test \
            -scheme AmgiFeatures-Package \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataFeatures" \
            -resultBundlePath "$RUNNER_TEMP/results/features.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:DecksFeatureTests/FilteredDeckFormModelTests \
            > "$RUNNER_TEMP/features.log" 2>&1
          status=$?
          grep -E "Test |✔|✘|error:|passed|failed|\*\* TEST" "$RUNNER_TEMP/features.log" | tail -400
          exit $status

      - name: Full iOS test plan
        if: always()
        run: |
          set +e
          xcodebuild test \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/results/full.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            > "$RUNNER_TEMP/full.log" 2>&1
          status=$?
          grep -E "✘|error:|passed after|failed after|\*\* TEST|Executed" "$RUNNER_TEMP/full.log" | tail -400
          exit $status

      - name: Generate UI test fixture collection
        if: always()
        run: |
          set +e
          TEST_RUNNER_AMGI_FIXTURE_OUT="$RUNNER_TEMP/fixture" xcodebuild test \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/results/fixture.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:AnkiProtoBridgeTests/UITestFixtureGenerator \
            > "$RUNNER_TEMP/fixture.log" 2>&1
          status=$?
          grep -E "✔|✘|error:|\*\* TEST" "$RUNNER_TEMP/fixture.log" | tail -50
          ls -la "$RUNNER_TEMP/fixture"
          test -f "$RUNNER_TEMP/fixture/collection.anki2" || exit 1
          exit $status

      - name: Build UI tests
        if: always()
        run: |
          set +e
          xcodebuild build-for-testing \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiAppUITests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation -skipMacroValidation \
            > "$RUNNER_TEMP/ui-build.log" 2>&1
          status=$?
          grep -E "error:|\*\* TEST" "$RUNNER_TEMP/ui-build.log" | tail -50
          exit $status

      - name: Seed the app with the fixture collection
        if: always()
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/AmgiApp.app"
          xcrun simctl uninstall "$SIM_UDID" com.amgiapp.AmgiApp || true
          xcrun simctl install "$SIM_UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.amgiapp.AmgiApp data)
          DEST="$CONTAINER/Library/Application Support/AnkiCollection/default"
          mkdir -p "$DEST"
          rm -rf "$DEST"/*
          cp "$RUNNER_TEMP/fixture/collection.anki2" "$DEST/"
          ls -la "$DEST"

      - name: Filtered deck UI test (create, study, relaunch)
        if: always()
        run: |
          set +e
          TEST_RUNNER_AMGI_SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" xcodebuild test-without-building \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiAppUITests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/results/ui.xcresult" \
            > "$RUNNER_TEMP/ui.log" 2>&1
          status=$?
          grep -E "Test Case|error:|XCTAssert|\*\* TEST|Executed" "$RUNNER_TEMP/ui.log" | tail -80
          mkdir -p "$RUNNER_TEMP/screenshots/xcresult"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/results/ui.xcresult" \
            --output-path "$RUNNER_TEMP/screenshots/xcresult" || true
          ls -la "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/screenshots/xcresult" || true
          exit $status

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-deck-ui-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7

      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-deck-test-results
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/results
          retention-days: 7
